spring:
  application:
    name: account-service

  datasource:
    url: jdbc:postgresql://localhost:5433/accountdb
    username: admin
    password: secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: secret

server:
  port: 8082

springdoc:
  swagger-ui:
    path: /swagger-ui.html5